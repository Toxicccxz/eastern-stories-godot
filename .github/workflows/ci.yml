name: Cross-Platform Build and Verify

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

# A new push replaces the PR's run for the old commit; a manual run is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # verify.py runs on several runners at once: the checks job runs every step but the
  # gameplay suites, and each shard job runs its share of the suites (each one a single-core
  # Godot process, four at a time on a 4-vCPU runner). Together they are the whole of
  # verify.py; `Godot Verify` passes only when all of them pass. The Windows build runs beside
  # them and does not wait for it. No Android or iOS build: the mobile port is paused
  # (owner 2026-11-04, DECISIONS「手机端暂停」).
  verify-checks:
    name: Godot Verify (checks)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Godot editor
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform linux --output build/toolchain --skip-templates

      - name: Run canonical verification without the gameplay suites
        run: python tools/ci/verify.py --godot "${{ steps.godot.outputs.godot }}" --skip-gameplay-tests

  verify-suites:
    name: Godot Verify (suites ${{ matrix.shard }}/${{ strategy.job-total }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # The suites take ~250 single-core minutes (2026-11-02) and grow with each region: when
    # a shard nears 15 minutes, add one to the matrix. verify.py splits them by the times in
    # tools/ci/suite_seconds.json. The longest suite (the world soak, ~4 minutes; its own
    # limit in verify.py) is the floor for a shard.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One axis only, listing exactly 1..N: N is the job total, so another axis or an
      # `include` would leave suites unrun.
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Godot editor
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform linux --output build/toolchain --skip-templates

      - name: Run the shard's gameplay suites
        run: >-
          python tools/ci/verify.py
          --godot "${{ steps.godot.outputs.godot }}"
          --suite-shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload gameplay suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-suite-logs-${{ matrix.shard }}
          path: build/verify-suites/logs
          if-no-files-found: ignore

  godot-verify:
    name: Godot Verify
    needs:
      - verify-checks
      - verify-suites
    # !cancelled(): a failed or timed-out verification job must fail this required check, not
    # skip it (a skipped check would not block the merge). When the whole run is cancelled
    # this job ends as cancelled, so a commit replaced by a new push reports no failure and
    # still no pass.
    if: >-
      !cancelled() && (
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          CHECKS: ${{ needs.verify-checks.result }}
          SUITES: ${{ needs.verify-suites.result }}
        run: |
          echo "Godot Verify (checks): $CHECKS"
          echo "Godot Verify (suites, all shards): $SUITES"
          test "$CHECKS" = success && test "$SUITES" = success

  windows-release:
    name: Windows Release Build
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Godot editor and templates
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform windows --output build/toolchain

      - name: Build Windows x86_64 Release
        run: >-
          python tools/build/build.py
          --target windows
          --godot "${{ steps.godot.outputs.godot }}"
          --templates "${{ steps.godot.outputs.templates }}"
          --require-clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: eastern-stories-godot-windows-x86_64
          path: |
            dist/Eastern-Stories-Godot-windows-x86_64.zip
            dist/windows/build-manifest.json
          if-no-files-found: error
