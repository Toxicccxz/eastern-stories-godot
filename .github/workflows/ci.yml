name: Cross-Platform Build and Verify

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # verify.py runs on several runners at once: the checks job runs every step but the
  # gameplay suites, and each shard job runs its share of the suites (each one a single-core
  # Godot process, four at a time on a 4-vCPU runner). Together they are the whole of
  # verify.py; `Godot Verify` passes only when all of them pass.
  verify-checks:
    name: Godot Verify (checks)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Godot editor
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform linux --output build/toolchain --skip-templates

      - name: Run canonical verification without the gameplay suites
        run: python tools/ci/verify.py --godot "${{ steps.godot.outputs.godot }}" --skip-gameplay-tests

  verify-suites:
    name: Godot Verify (suites ${{ matrix.shard }}/${{ strategy.job-total }})
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # The suites take ~130 single-core minutes (2026-10-11) and grow with each region: when
    # a shard nears 15 minutes, add one to the matrix.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Godot editor
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform linux --output build/toolchain --skip-templates

      - name: Run the shard's gameplay suites
        run: >-
          python tools/ci/verify.py
          --godot "${{ steps.godot.outputs.godot }}"
          --suite-shard ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload gameplay suite logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-suite-logs-${{ matrix.shard }}
          path: build/verify-suites/logs
          if-no-files-found: ignore

  godot-verify:
    name: Godot Verify
    needs:
      - verify-checks
      - verify-suites
    # always(): a failed or cancelled verification job must fail this required check, not
    # skip it (a skipped check would not block the merge).
    if: >-
      always() && (
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          CHECKS: ${{ needs.verify-checks.result }}
          SUITES: ${{ needs.verify-suites.result }}
        run: |
          echo "Godot Verify (checks): $CHECKS"
          echo "Godot Verify (suites, all shards): $SUITES"
          test "$CHECKS" = success && test "$SUITES" = success

  windows-release:
    name: Windows Release Build
    needs: godot-verify
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Godot editor and templates
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform windows --output build/toolchain

      - name: Build Windows x86_64 Release
        run: >-
          python tools/build/build.py
          --target windows
          --godot "${{ steps.godot.outputs.godot }}"
          --templates "${{ steps.godot.outputs.templates }}"
          --require-clean

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: eastern-stories-godot-windows-x86_64
          path: |
            dist/Eastern-Stories-Godot-windows-x86_64.zip
            dist/windows/build-manifest.json
          if-no-files-found: error

  android-release:
    name: Android Release Build
    needs: godot-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.18+8"

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;20.0" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install pinned Godot editor and templates
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform linux --output build/toolchain

      - name: Build Android ARM64 technical Release
        run: >-
          python tools/build/build.py
          --target android
          --godot "${{ steps.godot.outputs.godot }}"
          --templates "${{ steps.godot.outputs.templates }}"
          --android-sdk "$ANDROID_SDK_ROOT"
          --java-sdk "$JAVA_HOME"
          --require-clean

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: eastern-stories-godot-android-arm64
          path: |
            dist/android/Eastern-Stories-Godot-android-arm64.apk
            dist/android/build-manifest.json
          if-no-files-found: error

  ios-validation:
    name: iOS Build Validation
    needs: godot-verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select Xcode 26.3
        shell: bash
        run: |
          echo "Installed Xcode applications:"
          find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
          XCODE_APP="/Applications/Xcode_26.3.app"
          if [[ ! -d "$XCODE_APP" ]]; then
            echo "::error::Required Xcode 26.3 is unavailable at $XCODE_APP"
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install pinned Godot editor and templates
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform macos --output build/toolchain

      - name: Export and compile unsigned iOS Release
        run: >-
          python tools/build/build.py
          --target ios
          --godot "${{ steps.godot.outputs.godot }}"
          --templates "${{ steps.godot.outputs.templates }}"
          --require-clean

      - name: Upload iOS validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: eastern-stories-godot-ios-build-validation
          path: |
            dist/ios/Eastern-Stories-Godot-ios-xcode.zip
            dist/ios/build-manifest.json
            dist/ios/xcodebuild.log
          if-no-files-found: error
