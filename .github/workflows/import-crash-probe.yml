# TEMPORARY (phase/stability-check): loops the release copy's cold import under gdb to catch
# the occasional exit -6. Removed before the PR leaves draft.
name: Import crash probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        lane: [asis, nocinzel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdb
        run: sudo apt-get update -q && sudo apt-get install -y -q gdb
      - name: Install pinned Godot editor
        id: godot
        run: python tools/ci/bootstrap_godot.py --platform linux --output build/toolchain --skip-templates
      - name: Loop the cold imports
        run: |
          set +e
          G="${{ steps.godot.outputs.godot }}"
          python tools/build/prepare_release_project.py --source game --output build/rel
          if [ "${{ matrix.lane }}" = nocinzel ]; then
            rm -f build/rel/assets/fonts/Cinzel-VariableFont_wght.ttf build/rel/assets/fonts/Cinzel-VariableFont_wght.ttf.import
            sed -i 's#res://assets/fonts/Cinzel-VariableFont_wght.ttf#res://assets/fonts/LXGWWenKaiLite-Medium.ttf#' build/rel/presentation/title/title_logo.gd
          fi
          mkdir -p build/probe
          crashes=0
          for i in $(seq 1 20); do
            rm -rf build/rel/.godot
            start=$(date +%s)
            gdb -q -batch -return-child-result               -ex "set pagination off" -ex "handle SIGPIPE nostop noprint pass"               -ex run -ex "info threads" -ex "bt 30"               -ex "x/24i \$pc-48" -ex "frame 1" -ex "x/60i \$pc-200" -ex "frame 2" -ex "x/60i \$pc-200"               --args "$G" --headless --path build/rel --editor --quit > build/probe/rel_$i.log 2>&1
            rc=$?
            echo "${{ matrix.lane }} run $i rc=$rc $(( $(date +%s) - start )) s"
            if grep -q "received signal" build/probe/rel_$i.log; then
              crashes=$((crashes + 1))
              echo "---- crash in run $i"; grep -n -A 30 "received signal" build/probe/rel_$i.log | head -30
            fi
          done
          echo "${{ matrix.lane }}: $crashes crash(es) in 20"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-logs-${{ matrix.lane }}
          path: build/probe
